<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AVPR-Net — Source-code security review</title>
    <meta name="description" content="Connect authorized GitHub repositories, review scanner coverage and findings, and inspect focused patch proposals. Developers review every change before it is merged." />
    <script>
      try {
        const theme = localStorage.getItem("securepatch-theme") === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.querySelector('link[rel="icon"]').href = theme === "light" ? "/favicon-light.svg?v=3" : "/favicon.svg?v=3";
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.classList.toggle("light", theme === "light");
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    
    <!-- Preconnect to Google Fonts for Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-bg-primary text-text-primary font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
