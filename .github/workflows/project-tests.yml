name: Isolated project tests
on:
  repository_dispatch:
    types: [avpr-project-tests]
  workflow_dispatch:
    inputs:
      jobId:
        description: Approved AVPR-Net project-test job identifier
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: avpr-project-tests-${{ github.event.client_payload.jobId || inputs.jobId }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.1
      - name: Install trusted supervisor dependencies
        run: npm ci --ignore-scripts
        working-directory: backend
      - name: Pull reviewed runtime
        run: docker pull node:22.23.1-bookworm-slim@sha256:8607a9064d4a571140998ae9e52a3b3fcf9cff361d04642d5971e6cd76d39e27
      - name: Verify approved project tests
        env:
          AVPR_JOB_ID: ${{ github.event.client_payload.jobId || inputs.jobId }}
        run: node backend/runner/hosted-job.cjs
